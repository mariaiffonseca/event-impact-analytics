[project]
name = "event-impact-analytics"
version = "0.1.0"
description = "Event Impact Analytics — how NY Yankees home games affect taxi demand and travel patterns around Yankee Stadium."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_impact"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
